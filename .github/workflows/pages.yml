name: Course site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements-tested.txt mkdocs mkdocs-material
      # Links between pages are checked; --strict fails on any broken link or anchor.
      - run: python scripts/build_site.py --out site_build
      - run: python -m mkdocs build --strict -f site_build/mkdocs.yml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site_build/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
